<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Translation Editor</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --panel: #ffffff;
      --border: #dde3ee;
      --text: #263042;
      --muted: #6d7584;
      --accent: #5b67d8;
      --success: #15803d;
      --error: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(246, 247, 251, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }
    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    h1 {
      margin: 0;
      font-size: 20px;
    }
    .subtle {
      color: var(--muted);
      font-size: 12px;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="search"], button {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }
    input[type="search"] {
      min-width: 280px;
    }
    button {
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }
    main {
      padding: 20px;
    }
    .status {
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .status.success { color: var(--success); }
    .status.error { color: var(--error); }
    .section {
      margin: 18px 0 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      table-layout: fixed;
    }
    thead th {
      position: sticky;
      top: 76px;
      z-index: 5;
      background: #f8f9fc;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 12px;
      text-align: left;
    }
    tbody td {
      border-bottom: 1px solid var(--border);
      padding: 12px;
      vertical-align: top;
    }
    tbody tr:last-child td {
      border-bottom: 0;
    }
    .key {
      font-weight: 600;
      word-break: break-word;
    }
    .lang {
      width: 27%;
    }
    .meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    textarea {
      width: 100%;
      min-height: 74px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      line-height: 1.45;
    }
    .group-row td {
      background: #fbfcfe;
      font-weight: 700;
      color: #4c5568;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 12px;
      padding: 10px 12px;
    }
    .hidden { display: none; }
    @media (max-width: 1200px) {
      thead th {
        position: static;
      }
      input[type="search"] {
        min-width: 220px;
      }
    }
    @media (max-width: 860px) {
      table, thead, tbody, tr, th, td {
        display: block;
      }
      thead {
        display: none;
      }
      tbody td {
        border-bottom: 0;
      }
      .row-card {
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
      }
      .lang {
        width: 100%;
      }
      .key-cell::before,
      .lang-cell::before {
        content: attr(data-label);
        display: block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="title">
        <h1>Translation Editor</h1>
        <div class="subtle">Edits `website/scripts.js` directly and autosaves changes.</div>
      </div>
      <div class="controls">
        <input id="search" type="search" placeholder="Search keys or text…" />
        <button id="reload-btn" type="button">Reload</button>
        <button id="save-btn" type="button" class="primary">Save now</button>
      </div>
    </div>
  </header>

  <main>
    <div id="status" class="status">Loading translation data…</div>
    <div id="editor"></div>
  </main>

  <script>
    const state = {
      languages: ["en", "pl", "ru"],
      keyOrder: [],
      translations: {},
      saveTimer: null,
      dirty: false,
      lastSavedAt: null,
      loading: false,
    };

    const languageLabels = { en: "English", pl: "Polish", ru: "Russian" };
    const groupLabels = {
      nav: "Navigation",
      hero: "Hero",
      focus: "Focus",
      service: "Services",
      prices: "Pricing",
      price: "Pricing",
      coverage: "Coverage",
      onboarding: "Onboarding",
      map: "Map",
      step: "Steps",
      feedback: "Feedback",
      contact: "Contact",
      estimate: "Estimate",
      location: "Location",
      serviceability: "Serviceability",
      form: "Form",
      city: "Cities",
      success: "Success",
      footer: "Footer",
    };

    const statusEl = document.getElementById("status");
    const editorEl = document.getElementById("editor");
    const searchEl = document.getElementById("search");
    const reloadBtn = document.getElementById("reload-btn");
    const saveBtn = document.getElementById("save-btn");

    function setStatus(message, kind = "") {
      statusEl.textContent = message;
      statusEl.className = `status${kind ? ` ${kind}` : ""}`;
    }

    function groupForKey(key) {
      const prefix = key.split("_")[0];
      return groupLabels[prefix] || prefix;
    }

    function getFilteredKeys() {
      const query = searchEl.value.trim().toLowerCase();
      return state.keyOrder.filter(key => {
        if (!query) return true;
        const keyMatches = key.toLowerCase().includes(query);
        const textMatches = state.languages.some(language => {
          const value = state.translations[language]?.[key] || "";
          return value.toLowerCase().includes(query);
        });
        return keyMatches || textMatches;
      });
    }

    function renderEditor() {
      const filteredKeys = getFilteredKeys();
      const rows = [];
      let lastGroup = null;

      for (const key of filteredKeys) {
        const group = groupForKey(key);
        if (group !== lastGroup) {
          rows.push(`
            <tr class="group-row">
              <td colspan="5">${group}</td>
            </tr>
          `);
          lastGroup = group;
        }

        rows.push(`
          <tr class="row-card" data-key="${key}">
            <td class="key-cell" data-label="Key">
              <div class="key">${key}</div>
              <div class="meta">${group}</div>
            </td>
            ${state.languages.map(language => `
              <td class="lang lang-cell" data-label="${languageLabels[language] || language}">
                <textarea data-lang="${language}" data-key="${key}">${escapeHtml(state.translations[language]?.[key] || "")}</textarea>
              </td>
            `).join("")}
          </tr>
        `);
      }

      editorEl.innerHTML = `
        <table>
          <thead>
            <tr>
              <th style="width:19%">Key</th>
              <th class="lang">English</th>
              <th class="lang">Polish</th>
              <th class="lang">Russian</th>
            </tr>
          </thead>
          <tbody>${rows.join("") || `<tr><td colspan="5">No matching keys.</td></tr>`}</tbody>
        </table>
      `;

      editorEl.querySelectorAll("textarea").forEach(textarea => {
        textarea.addEventListener("input", handleTextareaInput);
      });
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function updateTextareaValue(language, key, value) {
      if (!state.translations[language]) {
        state.translations[language] = {};
      }
      state.translations[language][key] = value;
    }

    function handleTextareaInput(event) {
      const textarea = event.currentTarget;
      updateTextareaValue(textarea.dataset.lang, textarea.dataset.key, textarea.value);
      markDirty();
      scheduleSave();
    }

    function markDirty() {
      state.dirty = true;
      saveBtn.textContent = "Save now";
      setStatus("Unsaved changes", "error");
    }

    function markSaved() {
      state.dirty = false;
      state.lastSavedAt = new Date();
      saveBtn.textContent = "Save now";
      setStatus(`Saved at ${state.lastSavedAt.toLocaleTimeString()}`, "success");
    }

    function scheduleSave() {
      clearTimeout(state.saveTimer);
      state.saveTimer = setTimeout(() => {
        saveTranslations().catch(error => {
          setStatus(`Save failed: ${error.message}`, "error");
        });
      }, 700);
    }

    async function saveTranslations() {
      if (state.loading) return;
      saveBtn.disabled = true;
      try {
        const response = await fetch("/api/translations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ translations: state.translations }),
        });
        const payload = await response.json();
        if (!response.ok || payload.ok === false) {
          throw new Error(payload.error || `HTTP ${response.status}`);
        }
        markSaved();
      } finally {
        saveBtn.disabled = false;
      }
    }

    async function loadTranslations() {
      state.loading = true;
      setStatus("Loading translation data…");
      const response = await fetch("/api/translations", { cache: "no-store" });
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.error || `HTTP ${response.status}`);
      }
      state.languages = payload.languages || ["en", "pl", "ru"];
      state.keyOrder = payload.keyOrder || Object.keys(payload.translations?.en || {});
      state.translations = payload.translations || {};
      state.loading = false;
      renderEditor();
      setStatus(`Loaded ${state.keyOrder.length} translation keys.`);
    }

    reloadBtn.addEventListener("click", async () => {
      try {
        await loadTranslations();
      } catch (error) {
        setStatus(`Reload failed: ${error.message}`, "error");
      }
    });

    saveBtn.addEventListener("click", async () => {
      try {
        await saveTranslations();
      } catch (error) {
        setStatus(`Save failed: ${error.message}`, "error");
      }
    });

    searchEl.addEventListener("input", () => renderEditor());

    loadTranslations().catch(error => {
      setStatus(`Failed to load translation data: ${error.message}`, "error");
    });

    window.addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
        saveTranslations().catch(error => {
          setStatus(`Save failed: ${error.message}`, "error");
        });
      }
    });
  </script>
</body>
</html>
